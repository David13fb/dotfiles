# : Manager [[[

[mgr]
cwd = { fg = "#dfe3e7" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#8e79ff", bg = "#8e79ff" }
marker_cut      = { fg = "#e4dfff", bg = "#e4dfff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#c7c2ea", bg = "#c7c2ea" }

# Count
count_copied   = { fg = "#1a1836", bg = "#e4dfff" }
count_cut      = { fg = "#1a1836", bg = "#e4dfff" }
count_selected = { fg = "#003547", bg = "#c7c2ea" }

# Border
border_symbol = "│"
border_style  = { fg = "#8ccff0" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#8ccff0", bold = true, bg = "#0f1417" }
inactive  = { fg = "#b4cad6", bg = "#0f1417" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#8ccff0", fg = "#003547", bold = true }
normal_alt  = { bg = "#40484c", fg = "#c0c8cd" }

# Select mode
select_main = { bg = "#b4cad6", fg = "#1f333d", bold = true }
select_alt  = { bg = "#40484c", fg = "#c0c8cd" }

# Unset mode
unset_main = { bg = "#c7c2ea", fg = "#2f2d4c", bold = true }
unset_alt  = { bg = "#40484c", fg = "#c0c8cd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#55839c" }
perm_write = { fg = "#5f50c3" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#6346ff" }
perm_sep   = { fg = "#26b4ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#8ccff0", bg = "#353a3d" }
progress_error  = { fg = "#ffb4ab", bg = "#353a3d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#353a3d" }
cand = { fg = "#8ccff0" }
rest = { fg = "#003547" }
desc = { fg = "#dfe3e7" }
separator = " ▶ "
separator_style = { fg = "#dfe3e7" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c7c2ea" }
title_warn  = { fg = "#8ccff0" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#8ccff0" }
active = { fg = "#c7c2ea", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#8ccff0" }
value  = { fg = "#dfe3e7" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8ccff0", bg = "#003547" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#8ccff0" }
title   = {}
hovered = { fg = "#e4dfff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dfe3e7" }
run    = { fg = "#dfe3e7" }
footer = { fg = "#1f333d", bg = "#b4cad6" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dfe3e7" },
    { url = "*/", fg = "#8ccff0" },
]

# : ]]]
