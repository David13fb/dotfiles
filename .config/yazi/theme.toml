# : Manager [[[

[mgr]
cwd = { fg = "#dee3e5" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#758cff", bg = "#758cff" }
marker_cut      = { fg = "#dbe1ff", bg = "#dbe1ff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#bcc5eb", bg = "#bcc5eb" }

# Count
count_copied   = { fg = "#101a37", bg = "#dbe1ff" }
count_cut      = { fg = "#101a37", bg = "#dbe1ff" }
count_selected = { fg = "#00363e", bg = "#bcc5eb" }

# Border
border_symbol = "│"
border_style  = { fg = "#83d2e3" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#83d2e3", bold = true, bg = "#0e1416" }
inactive  = { fg = "#b1cbd1", bg = "#0e1416" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#83d2e3", fg = "#00363e", bold = true }
normal_alt  = { bg = "#3f484a", fg = "#bfc8cb" }

# Select mode
select_main = { bg = "#b1cbd1", fg = "#1c3439", bold = true }
select_alt  = { bg = "#3f484a", fg = "#bfc8cb" }

# Unset mode
unset_main = { bg = "#bcc5eb", fg = "#262f4d", bold = true }
unset_alt  = { bg = "#3f484a", fg = "#bfc8cb" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#568793" }
perm_write = { fg = "#465fc8" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#4262ff" }
perm_sep   = { fg = "#09d2ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#83d2e3", bg = "#343a3c" }
progress_error  = { fg = "#ffb4ab", bg = "#343a3c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#343a3c" }
cand = { fg = "#83d2e3" }
rest = { fg = "#00363e" }
desc = { fg = "#dee3e5" }
separator = " ▶ "
separator_style = { fg = "#dee3e5" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#bcc5eb" }
title_warn  = { fg = "#83d2e3" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#83d2e3" }
active = { fg = "#bcc5eb", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#83d2e3" }
value  = { fg = "#dee3e5" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#83d2e3", bg = "#00363e" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#83d2e3" }
title   = {}
hovered = { fg = "#dbe1ff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dee3e5" }
run    = { fg = "#dee3e5" }
footer = { fg = "#1c3439", bg = "#b1cbd1" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dee3e5" },
    { url = "*/", fg = "#83d2e3" },
]

# : ]]]
