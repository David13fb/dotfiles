# : Manager [[[

[mgr]
cwd = { fg = "#ebe1d4" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#86d17a", bg = "#86d17a" }
marker_cut      = { fg = "#cbebc6", bg = "#cbebc6" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#afcfab", bg = "#afcfab" }

# Count
count_copied   = { fg = "#062109", bg = "#cbebc6" }
count_cut      = { fg = "#062109", bg = "#cbebc6" }
count_selected = { fg = "#3f2e00", bg = "#afcfab" }

# Border
border_symbol = "│"
border_style  = { fg = "#e7c26c" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#e7c26c", bold = true, bg = "#17130b" }
inactive  = { fg = "#d7c4a0", bg = "#17130b" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#e7c26c", fg = "#3f2e00", bold = true }
normal_alt  = { bg = "#4d4639", fg = "#d0c5b4" }

# Select mode
select_main = { bg = "#d7c4a0", fg = "#3a2f15", bold = true }
select_alt  = { bg = "#4d4639", fg = "#d0c5b4" }

# Unset mode
unset_main = { bg = "#afcfab", fg = "#1c361d", bold = true }
unset_alt  = { bg = "#4d4639", fg = "#d0c5b4" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#9c7d42" }
perm_write = { fg = "#598f52" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#64c355" }
perm_sep   = { fg = "#ffaf01" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#e7c26c", bg = "#3e392f" }
progress_error  = { fg = "#ffb4ab", bg = "#3e392f" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3e392f" }
cand = { fg = "#e7c26c" }
rest = { fg = "#3f2e00" }
desc = { fg = "#ebe1d4" }
separator = " ▶ "
separator_style = { fg = "#ebe1d4" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#afcfab" }
title_warn  = { fg = "#e7c26c" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#e7c26c" }
active = { fg = "#afcfab", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#e7c26c" }
value  = { fg = "#ebe1d4" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#e7c26c", bg = "#3f2e00" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#e7c26c" }
title   = {}
hovered = { fg = "#cbebc6", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#ebe1d4" }
run    = { fg = "#ebe1d4" }
footer = { fg = "#3a2f15", bg = "#d7c4a0" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#ebe1d4" },
    { url = "*/", fg = "#e7c26c" },
]

# : ]]]
