# : Manager [[[

[mgr]
cwd = { fg = "#dfe3e7" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#9d78ff", bg = "#9d78ff" }
marker_cut      = { fg = "#e7deff", bg = "#e7deff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#cbc1e9", bg = "#cbc1e9" }

# Count
count_copied   = { fg = "#1d1735", bg = "#e7deff" }
count_cut      = { fg = "#1d1735", bg = "#e7deff" }
count_selected = { fg = "#00344a", bg = "#cbc1e9" }

# Border
border_symbol = "│"
border_style  = { fg = "#91cef4" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#91cef4", bold = true, bg = "#0f1417" }
inactive  = { fg = "#b6c9d8", bg = "#0f1417" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#91cef4", fg = "#00344a", bold = true }
normal_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Select mode
select_main = { bg = "#b6c9d8", fg = "#20333e", bold = true }
select_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Unset mode
unset_main = { bg = "#cbc1e9", fg = "#332c4c", bold = true }
unset_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#557fa0" }
perm_write = { fg = "#6c50c1" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#7845ff" }
perm_sep   = { fg = "#2ca8ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#91cef4", bg = "#353a3d" }
progress_error  = { fg = "#ffb4ab", bg = "#353a3d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#353a3d" }
cand = { fg = "#91cef4" }
rest = { fg = "#00344a" }
desc = { fg = "#dfe3e7" }
separator = " ▶ "
separator_style = { fg = "#dfe3e7" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#cbc1e9" }
title_warn  = { fg = "#91cef4" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#91cef4" }
active = { fg = "#cbc1e9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#91cef4" }
value  = { fg = "#dfe3e7" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#91cef4", bg = "#00344a" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#91cef4" }
title   = {}
hovered = { fg = "#e7deff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dfe3e7" }
run    = { fg = "#dfe3e7" }
footer = { fg = "#20333e", bg = "#b6c9d8" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dfe3e7" },
    { url = "*/", fg = "#91cef4" },
]

# : ]]]
