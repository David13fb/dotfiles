# : Manager [[[

[mgr]
cwd = { fg = "#e8e0e8" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff7382", bg = "#ff7382" }
marker_cut      = { fg = "#ffd9dd", bg = "#ffd9dd" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f3b7bf", bg = "#f3b7bf" }

# Count
count_copied   = { fg = "#321017", bg = "#ffd9dd" }
count_cut      = { fg = "#321017", bg = "#ffd9dd" }
count_selected = { fg = "#3d2459", bg = "#f3b7bf" }

# Border
border_symbol = "│"
border_style  = { fg = "#dabaf9" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#dabaf9", bold = true, bg = "#151218" }
inactive  = { fg = "#d0c1da", bg = "#151218" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#dabaf9", fg = "#3d2459", bold = true }
normal_alt  = { bg = "#4a454e", fg = "#ccc4cf" }

# Select mode
select_main = { bg = "#d0c1da", fg = "#362d3f", bold = true }
select_alt  = { bg = "#4a454e", fg = "#ccc4cf" }

# Unset mode
unset_main = { bg = "#f3b7bf", fg = "#4b252b", bold = true }
unset_alt  = { bg = "#4a454e", fg = "#ccc4cf" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#8761a1" }
perm_write = { fg = "#dd344a" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff4054" }
perm_sep   = { fg = "#ab42ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#dabaf9", bg = "#3c383e" }
progress_error  = { fg = "#ffb4ab", bg = "#3c383e" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3c383e" }
cand = { fg = "#dabaf9" }
rest = { fg = "#3d2459" }
desc = { fg = "#e8e0e8" }
separator = " ▶ "
separator_style = { fg = "#e8e0e8" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#f3b7bf" }
title_warn  = { fg = "#dabaf9" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#dabaf9" }
active = { fg = "#f3b7bf", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#dabaf9" }
value  = { fg = "#e8e0e8" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#dabaf9", bg = "#3d2459" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#dabaf9" }
title   = {}
hovered = { fg = "#ffd9dd", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e8e0e8" }
run    = { fg = "#e8e0e8" }
footer = { fg = "#362d3f", bg = "#d0c1da" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e8e0e8" },
    { url = "*/", fg = "#dabaf9" },
]

# : ]]]
