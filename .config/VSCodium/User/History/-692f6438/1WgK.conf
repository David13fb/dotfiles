source = colors.conf

$font = "SF Pro Display","JetBrainsMono Nerd Font Propo";

general {
    hide_cursor = true
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = $image  # Usa la imagen de tu variable $image
    color = $background
    blur_passes = 2 # 0 para desactivar si prefieres ver la imagen nítida
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    rounding = 15

    # Colores aplicados desde tu paleta
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    
    fade_on_empty = false
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
